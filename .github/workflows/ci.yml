name: School Framework CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Test & OpenAPI Schema
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Check
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: ci-testing-secret-key-not-for-production
          DEBUG: 'True'
        run: |
          python backend/manage.py check

      - name: Production security settings check
        env:
          DB_ENGINE: django.db.backends.sqlite3
          DEBUG: 'False'
          SECRET_KEY: ci-production-check-key-3f9b271bb475418ba54c6e9875ad2361
          ALLOWED_HOSTS: school.example
          SECURE_HSTS_SECONDS: '300'
        run: python scripts/check_production_security.py

      - name: Run Django Unit & Integration Tests
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: ci-testing-secret-key-not-for-production
          DEBUG: 'True'
        run: |
          python backend/manage.py test apps.core apps.legal apps.admissions apps.nutrition apps.safety apps.news apps.schedule apps.gallery

      - name: Validate OpenAPI / Swagger Specification
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: ci-testing-secret-key-not-for-production
          DEBUG: 'True'
        run: |
          python backend/manage.py spectacular --validate --fail-on-warn --file /tmp/school-openapi.yaml

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Test UI API client
        run: npm test

      - name: Type Check & Build Assets
        run: npm run build

  roles-mysql:
    name: Editor roles on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: school_roles_test
          MYSQL_USER: school_roles
          MYSQL_PASSWORD: ci-roles-password
          MYSQL_ROOT_PASSWORD: ci-roles-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-roles-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Test editor roles against MySQL
        env:
          PYTHONPATH: backend
          DEBUG: 'True'
          SECRET_KEY: ci-mysql-roles-test-key
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: school_roles_test
          DB_USER: root
          DB_PASSWORD: ci-roles-root-password
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
        run: python backend/manage.py test apps.core.test_roles --noinput

  installed-package-smoke:
    name: Installed package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            frontend: false
          - os: ubuntu-latest
            python: '3.12'
            frontend: true
          - os: windows-latest
            python: '3.12'
            frontend: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install wheel build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - uses: actions/setup-node@v4
        if: matrix.frontend
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and exercise the wheel
        env:
          PYTHONUTF8: '1'
          SMOKE_SKIP_FRONTEND: ${{ matrix.frontend == false && '1' || '0' }}
        run: python scripts/smoke_installed_package.py

  scripts-validation:
    name: Shell Scripts & Deployment Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Syntax check bash automation scripts
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/deploy.sh

      - name: Validate optional production Compose example
        env:
          SECRET_KEY: ci-production-check-key-3f9b271bb475418ba54c6e9875ad2361
          ALLOWED_HOSTS: school.example
          DB_NAME: school
          DB_USER: school
          DB_PASSWORD: ci-db-password
          DB_ROOT_PASSWORD: ci-root-password
        run: docker compose -f docker-compose.prod.yml config --quiet
