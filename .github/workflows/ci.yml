name: School Framework CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Test & OpenAPI Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Check
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: ci-testing-secret-key-not-for-production
          DEBUG: 'True'
        run: |
          python backend/manage.py check

      - name: Run Django Unit & Integration Tests
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: ci-testing-secret-key-not-for-production
          DEBUG: 'True'
        run: |
          python backend/manage.py test apps.core apps.legal apps.admissions apps.nutrition apps.safety apps.news apps.schedule apps.gallery

      - name: Validate OpenAPI / Swagger Specification
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: ci-testing-secret-key-not-for-production
          DEBUG: 'True'
        run: |
          python backend/manage.py spectacular --validate

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Type Check & Build Assets
        run: npm run build

  scripts-validation:
    name: Shell Scripts & Deployment Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Syntax check bash automation scripts
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/deploy.sh
